<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ParkSave - Parking Reservation</title>
<style>
  *{box-sizing:border-box;font-family:Arial,sans-serif}
  body{margin:0;background:#e0f7fa;color:#222}
  header{background:#0097a7;color:white;padding:25px;text-align:center}
  header h1{margin:0;font-size:32px}
  .container{max-width:600px;margin:20px auto;padding:15px}
  .card{background:white;padding:20px;border-radius:15px;box-shadow:0 2px 10px rgba(0,0,0,.1);margin-bottom:20px}
  label{display:block;margin:12px 0 5px;font-weight:bold}
  input,select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}
  .slots{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}
  .slot{padding:15px;border:2px solid #0097a7;border-radius:10px;text-align:center;cursor:pointer;font-weight:bold;background:#f0fafa}
  .slot.selected{background:#0097a7;color:white}
  .slot.booked{background:#ccc;color:#777;border-color:#aaa;cursor:not-allowed;text-decoration:line-through}
  button{width:100%;padding:14px;background:#0097a7;color:white;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:15px;cursor:pointer}
  .booking{background:#f7f7f7;padding:12px;border-radius:10px;margin-top:10px}
  .back{display:block;text-align:center;margin-top:15px;color:#0097a7}
</style>
</head>
<body>
<header>
  <h1>🅿️ ParkSave</h1>
  <p>Simple Parking Reservation</p>
</header>
<div class="container">
  <div class="card">
    <h2>Book a Parking Slot</h2>
    <label>Your Name</label>
    <input id="name" placeholder="e.g. Irish Dalmasi">
    <label>Plate Number</label>
    <input id="plate" placeholder="e.g. ABC-1234">
    <label>Date</label>
    <input type="date" id="date">
    <label>Time</label>
    <select id="time">
      <option>8:00 AM - 10:00 AM</option>
      <option>10:00 AM - 12:00 PM</option>
      <option>1:00 PM - 3:00 PM</option>
      <option>3:00 PM - 5:00 PM</option>
    </select>
    <label>Choose Slot</label>
    <div class="slots" id="slots"></div>
    <button onclick="book()">Book Now</button>
    <p id="msg" style="text-align:center;font-weight:bold"></p>
  </div>
  <div class="card">
    <h2>My Bookings</h2>
    <div id="list"><p>No bookings yet.</p></div>
  </div>
  <a class="back" href="https://dalmasiirish-tech.github.io/">← Back to Portfolio</a>
</div>
<script>
  let selected = null;
  let bookings = JSON.parse(localStorage.getItem('parksave') || '[]');
  function renderSlots(){
    let box = document.getElementById('slots');
    box.innerHTML = '';
    for(let i=1;i<=8;i++){
      let isBooked = bookings.some(b=>b.slot==='Slot '+i);
      let div = document.createElement('div');
      div.className = 'slot' + (isBooked ? ' booked' : '') + (selected==='Slot '+i ? ' selected':'');
      div.textContent = 'Slot '+i;
      if(!isBooked){ div.onclick = ()=>{ selected='Slot '+i; renderSlots(); }; }
      box.appendChild(div);
    }
  }
  function renderList(){
    let list = document.getElementById('list');
    if(bookings.length===0){ list.innerHTML='<p>No bookings yet.</p>'; return; }
    list.innerHTML = bookings.map((b,i)=>`<div class="booking"><b>${b.slot}</b> - ${b.name} (${b.plate})<br>${b.date} | ${b.time}<br><button onclick="cancelBooking(${i})" style="background:#ff5252;margin-top:8px;padding:8px">Cancel</button></div>`).join('');
  }
  function book(){
    let name=document.getElementById('name').value;
    let plate=document.getElementById('plate').value;
    let date=document.getElementById('date').value;
    let time=document.getElementById('time').value;
    if(!name||!plate||!date||!selected){ document.getElementById('msg').textContent='Please fill all fields and choose a slot!'; document.getElementById('msg').style.color='red'; return; }
    bookings.push({name,plate,date,time,slot:selected});
    localStorage.setItem('parksave',JSON.stringify(bookings));
    selected=null; renderSlots(); renderList();
    document.getElementById('msg').textContent='✅ Booked! See you at '+bookings[bookings.length-1].slot;
    document.getElementById('msg').style.color='green';
  }
  function cancelBooking(i){ bookings.splice(i,1); localStorage.setItem('parksave',JSON.stringify(bookings)); renderSlots(); renderList(); }
  renderSlots(); renderList();
</script>
</body>
</html>
